<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 中英搜索 · 设置</title><style>
:root{color-scheme:light dark;font:15px/1.65 system-ui;color:light-dark(#1f2328,#e6edf3);background:light-dark(#f6f8fa,#0d1117)}body{max-width:720px;margin:48px auto;padding:0 24px}h1{font-size:28px;margin-bottom:8px}.card{background:light-dark(white,#161b22);border:1px solid light-dark(#d1d9e0,#30363d);border-radius:14px;padding:24px;margin-top:24px}label{display:block;margin:18px 0 6px;font-weight:600}input:not([type=checkbox]){box-sizing:border-box;width:100%;padding:11px;border:1px solid #8c959f;border-radius:7px;font:inherit;background:transparent;color:inherit}button{padding:9px 14px;border:1px solid #8c959f;border-radius:7px;cursor:pointer;font:inherit}button.primary{background:#238636;color:white;border-color:#238636}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.muted,small{color:light-dark(#59636e,#9da7b3)}#status{white-space:pre-wrap;margin-top:18px}code{font-size:13px}.error{color:light-dark(#b42318,#ff8b82)}
</style></head><body><p class="muted">GitHub 中英项目搜索 / 0.1.0</p><h1>中文搜索，发现更多项目</h1><p class="muted">常见关键词使用本地词库。自由描述通过你配置的模型转换，结果来自 GitHub。</p><main class="card"><form id="settings"><label for="base">API Base URL</label><input id="base" type="url" placeholder="https://你的服务地址/v1" required><small>兼容 Chat Completions 的 HTTPS 接口；不要包含 /chat/completions。</small><label for="model">模型名称</label><input id="model" required placeholder="服务商提供的模型 ID"><label for="key">API Key</label><input id="key" type="password" autocomplete="off" placeholder="输入密钥"><small id="key-state">密钥不会出现在 GitHub 网页中。</small><label><input id="remember" type="checkbox"> 记住密钥（仅存于本机扩展存储，不是加密保险库）</label><small>默认仅在当前浏览器会话内保存；重启浏览器后需重新填写。仅搜索文字会发送给模型服务商。</small><div class="actions"><button class="primary" type="submit">授权并保存</button><button id="test" type="button">测试连接</button></div></form><p id="status" role="status" aria-live="polite"></p></main><section class="card"><strong>数据与缓存</strong><p class="muted">翻译缓存 30 天，项目结果缓存 5 分钟。扩展不上传遥测，不读取 GitHub 登录凭证。匿名 GitHub 搜索可能被限流。</p><div class="actions"><button id="cache">清除搜索与翻译缓存</button><button id="clear">清除全部配置和密钥</button></div></section><script type="module" src="options.js"></script></body></html>
